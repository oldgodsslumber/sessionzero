<!-- Daring Comics — the reference pack and the shell regression test. -->
<!--
     One folder per game, so the Pages URL is a clean /daring-comics/ rather than
     a .html file. The nav, page containers and modal shells are
     built by core/chrome.js at boot, so this file carries no markup: the
     only per-game part is the script list below.

     Load order is execution order and must not be reordered. The pack
     registers itself at load; core/mp-boot.js boots the app and stays last.
-->
<script src="../core/system.js"></script>
<script src="../core/chrome.js"></script>
<script src="../core/icons.js"></script>
<script src="../core/blocks.js"></script>
<script src="../systems/daring-comics/data.js"></script>

<script src="../core/dice.js"></script>
<script src="../core/conflict.js"></script>
<script src="../core/log.js"></script>
<script src="../core/map.js"></script>
<script src="../core/util.js"></script>
<script src="../core/llm.js"></script>
<script src="../core/wiki.js"></script>

</body>
